name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paysim
          POSTGRES_PASSWORD: paysim
          POSTGRES_DB: paysim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Runs migrations via the standalone CLI; the test suite migrates again,
      # which also proves migrations are idempotent.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://paysim:paysim@localhost:5432/paysim
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://paysim:paysim@localhost:5432/paysim

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build
